{% extends "base.html" %}
{% block title %}Create account - FinLite{% endblock %}
{% block content %}
<div class="page-narrow">
  <div class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Join FinLite to manage your invoices</p>
    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('register_page') }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn">Create account</button>
    </form>
    <p class="helper-text">Already have an account? <a href="{{ url_for('login_page') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
