{% extends "base.html" %}
{% block title %}Admin - Users - FinVault{% endblock %}
{% block content %}
<p class="subtitle"><a href="{{ url_for('admin_dashboard') }}">&larr; Back to admin dashboard</a></p>
<h1>All Users</h1>
<div class="card">
  <table>
    <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr><td class="invoice-id">{{ u.id }}</td><td>{{ u.username }}</td><td>{{ u.email }}</td><td><span class="role-badge">{{ u.role }}</span></td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
