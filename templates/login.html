{% extends "base.html" %}
{% block title %}Log in - FinVault{% endblock %}
{% block content %}
<div class="page-narrow">
  <div class="card">
    
    <p class="subtitle">Sign in to your account</p>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login_page') }}">
      <div class="field"><label for="username">Username</label><input type="text" id="username" name="username" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" required></div>
      <button type="submit" class="btn">Sign in</button>
    </form>
    <p class="helper-text">Don't have an account? <a href="{{ url_for('register_page') }}">Create one</a></p>
  </div>
</div>
{% endblock %}
